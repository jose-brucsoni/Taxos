[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taxos"
version = "0.1.0"
description = "Organiza la carpeta Descargas en Windows y Linux"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "platformdirs>=4",
    "send2trash>=1.8",
    "pyyaml>=6",
    "pywebview>=5.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "watchdog>=4",
]

[project.optional-dependencies]
build = ["pyinstaller>=6"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.scripts]
taxos = "taxos.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
taxos = ["default_rules.yaml"]
